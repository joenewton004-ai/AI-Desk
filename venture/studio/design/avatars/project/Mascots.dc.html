<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>More mascots</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#ff8a3d}a:hover{color:#ffb07a}
</style>
</helmet>
<div style="width: 1440px; height: 1240px; box-sizing: border-box; padding: 48px 64px; background: #1b2330; color: #f3f1ec; font-family: Lato, Carlito, 'DejaVu Sans', sans-serif; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; color: #9fb0c6">Backtest Bench · mascots in the Candle family</div>
      <h1 style="margin: 0; font-size: 44px; font-weight: 900">Five more like Candle</h1>
    </div>
    <p style="margin: 0; max-width: 540px; font-size: 17px; line-height: 1.5; color: #c6d0dd">All built from things on a trading chart, all in the channel's colours. Same five moods each, so any of them drops straight into the video build.</p>
  </div>

  <sc-for list="{{mascots}}" as="m" hint-placeholder-count="5">
    <div style="display: flex; gap: 24px; align-items: center; background: #222c3b; border-radius: 16px; padding: 14px 22px">
      <div style="width: 260px; flex: none; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #ff8a3d">{{m.tag}}</div>
        <div style="font-size: 25px; font-weight: 900">{{m.name}}</div>
        <div style="font-size: 14px; line-height: 1.45; color: #c6d0dd">{{m.pitch}}</div>
      </div>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px">
        <sc-for list="{{faces}}" as="f" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 4px; align-items: center">
            <div style="width: 160px; height: 160px; background: #1b2330; border-radius: 12px; display: flex; align-items: center; justify-content: center">
              <svg viewBox="0 0 200 200" width="150" height="150" role="img" aria-label="{{m.name}}, {{f.label}}">
                <sc-if value="{{m.isLab}}" hint-placeholder-val="{{ true }}">
                  <line x1="100" y1="10" x2="100" y2="50" stroke="#ff8a3d" stroke-width="8" stroke-linecap="round"></line>
                  <rect x="56" y="48" width="88" height="124" rx="14" fill="#ff8a3d"></rect>
                  <path d="M56 130 L144 130 L144 158 Q144 172 130 172 L70 172 Q56 172 56 158 Z" fill="#f3f1ec"></path>
                  <path d="M100 130 L92 150 L100 172 L108 150 Z" fill="#8fb3d9"></path>
                  <circle cx="80" cy="90" r="15" fill="none" stroke="#1b2330" stroke-width="4"></circle>
                  <circle cx="120" cy="90" r="15" fill="none" stroke="#1b2330" stroke-width="4"></circle>
                  <line x1="95" y1="90" x2="105" y2="90" stroke="#1b2330" stroke-width="4"></line>
                  <line x1="100" y1="172" x2="100" y2="194" stroke="#ff8a3d" stroke-width="8" stroke-linecap="round"></line>
                  <rect x="14" y="104" width="42" height="10" rx="5" fill="#ff8a3d"></rect>
                  <rect x="8" y="88" width="16" height="26" rx="4" fill="#8fb3d9"></rect>
                  <rect x="144" y="104" width="38" height="10" rx="5" fill="#ff8a3d"></rect>
                </sc-if>
                <sc-if value="{{m.isWick}}" hint-placeholder-val="{{ false }}">
                  <path d="M100 6 Q112 22 100 36 Q88 22 100 6 Z" fill="#ffd36b"></path>
                  <line x1="100" y1="34" x2="100" y2="60" stroke="#f3f1ec" stroke-width="6" stroke-linecap="round"></line>
                  <rect x="46" y="58" width="108" height="112" rx="40" fill="#ff8a3d"></rect>
                  <ellipse cx="72" cy="122" rx="10" ry="6" fill="#ff6b6b" opacity="0.5"></ellipse>
                  <ellipse cx="128" cy="122" rx="10" ry="6" fill="#ff6b6b" opacity="0.5"></ellipse>
                  <rect x="64" y="166" width="16" height="20" rx="8" fill="#ff8a3d"></rect>
                  <rect x="120" y="166" width="16" height="20" rx="8" fill="#ff8a3d"></rect>
                </sc-if>
                <sc-if value="{{m.isDoji}}" hint-placeholder-val="{{ false }}">
                  <line x1="100" y1="8" x2="100" y2="192" stroke="#8fb3d9" stroke-width="10" stroke-linecap="round"></line>
                  <rect x="40" y="60" width="120" height="76" rx="18" fill="#8fb3d9"></rect>
                  <rect x="40" y="94" width="120" height="8" fill="#6d93bd"></rect>
                  <rect x="12" y="92" width="28" height="10" rx="5" fill="#8fb3d9"></rect>
                  <rect x="160" y="92" width="28" height="10" rx="5" fill="#8fb3d9"></rect>
                </sc-if>
                <sc-if value="{{m.isDuo}}" hint-placeholder-val="{{ false }}">
                  <line x1="62" y1="20" x2="62" y2="186" stroke="#6cc58c" stroke-width="7" stroke-linecap="round"></line>
                  <rect x="30" y="58" width="64" height="104" rx="12" fill="#6cc58c"></rect>
                  <line x1="140" y1="30" x2="140" y2="192" stroke="#e5675c" stroke-width="7" stroke-linecap="round"></line>
                  <rect x="108" y="74" width="64" height="104" rx="12" fill="#e5675c"></rect>
                </sc-if>
                <sc-if value="{{m.isCoin}}" hint-placeholder-val="{{ false }}">
                  <circle cx="100" cy="102" r="74" fill="#c8a24a"></circle>
                  <circle cx="100" cy="102" r="62" fill="#e8c547"></circle>
                  <path d="M60 50 Q100 34 140 50" stroke="#fff3c4" stroke-width="6" fill="none" stroke-linecap="round"></path>
                  <rect x="20" y="104" width="14" height="40" rx="7" fill="#c8a24a"></rect>
                  <rect x="166" y="104" width="14" height="40" rx="7" fill="#c8a24a"></rect>
                </sc-if>
                <sc-if value="{{m.isDuo}}" hint-placeholder-val="{{ false }}">
                  <g transform="translate(12 52) scale(0.5)">
                    <path d="{{f.brow}}" stroke="#1b2330" stroke-width="9" stroke-linecap="round" fill="none"></path>
                    <ellipse cx="80" cy="90" rx="9" ry="{{f.eye}}" fill="#1b2330"></ellipse>
                    <ellipse cx="120" cy="90" rx="9" ry="{{f.eye}}" fill="#1b2330"></ellipse>
                    <path d="{{f.mouth}}" stroke="#1b2330" stroke-width="8" stroke-linecap="round" fill="{{f.mouthFillDark}}"></path>
                  </g>
                  <g>
                    <path d="M118 104 L134 100 M146 100 L162 104" stroke="#1b2330" stroke-width="5" stroke-linecap="round" fill="none"></path>
                    <ellipse cx="128" cy="118" rx="5" ry="4" fill="#1b2330"></ellipse>
                    <ellipse cx="152" cy="118" rx="5" ry="4" fill="#1b2330"></ellipse>
                    <path d="M130 148 Q140 140 150 148" stroke="#1b2330" stroke-width="4" stroke-linecap="round" fill="none"></path>
                  </g>
                </sc-if>
                <sc-if value="{{m.soloFace}}" hint-placeholder-val="{{ true }}">
                  <path d="{{f.brow}}" stroke="#1b2330" stroke-width="6" stroke-linecap="round" fill="none"></path>
                  <ellipse cx="80" cy="{{m.eyeY}}" rx="{{m.eyeR}}" ry="{{f.eye}}" fill="#1b2330"></ellipse>
                  <ellipse cx="120" cy="{{m.eyeY}}" rx="{{m.eyeR}}" ry="{{f.eye}}" fill="#1b2330"></ellipse>
                  <path d="{{f.mouth}}" stroke="#1b2330" stroke-width="5" stroke-linecap="round" fill="{{f.mouthFillDark}}" transform="{{m.mouthShift}}"></path>
                </sc-if>
              </svg>
            </div>
            <div style="font-size: 14px; font-weight: 700">{{f.label}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const faces = [
      { label: 'Neutral', brow: 'M66 72 L90 70 M110 70 L134 72', eye: 6, mouth: 'M84 118 Q100 126 116 118', mouthFillDark: 'none' },
      { label: 'Shocked', brow: 'M66 62 L90 56 M110 56 L134 62', eye: 9, mouth: 'M90 122 a10 12 0 1 0 20 0 a10 12 0 1 0 -20 0', mouthFillDark: '#1b2330' },
      { label: 'Sceptical', brow: 'M66 74 L90 72 M110 62 L134 68', eye: 4, mouth: 'M86 124 L114 118', mouthFillDark: 'none' },
      { label: 'Pleased', brow: 'M66 66 L90 64 M110 64 L134 66', eye: 3, mouth: 'M80 114 Q100 138 120 114', mouthFillDark: 'none' },
      { label: 'Thinking', brow: 'M66 70 L90 72 M110 66 L134 66', eye: 6, mouth: 'M90 122 Q104 118 114 122', mouthFillDark: 'none' }
    ];
    const base = { isLab: false, isWick: false, isDoji: false, isDuo: false, isCoin: false, soloFace: true, eyeY: 90, eyeR: 7, mouthShift: '' };
    return {
      faces,
      mascots: [
        { ...base, isLab: true, tag: 'B1', name: 'Lab Candle',
          pitch: 'Candle in goggles and a lab coat, holding a test tube. Says "we test things" at a glance.' },
        { ...base, isWick: true, tag: 'B2', name: 'Wick', eyeY: 100, eyeR: 8, mouthShift: 'translate(0 8)',
          pitch: 'A small, round, cute candle with a lit flame. Most likeable; strongest for Shorts.' },
        { ...base, isDoji: true, tag: 'B3', name: 'Doji', eyeY: 84, eyeR: 7, mouthShift: 'translate(0 -6)',
          pitch: 'A doji candle: open and close the same, the chart sign for "undecided". The sceptic who weighs both sides.' },
        { ...base, isDuo: true, soloFace: false, tag: 'B4', name: 'Bull & Bear',
          pitch: 'A green up-candle and a red down-candle as a double act. The red one stays deadpan; the green one reacts.' },
        { ...base, isCoin: true, tag: 'B5', name: 'Coin', eyeY: 96, eyeR: 7, mouthShift: 'translate(0 4)',
          pitch: 'The coin flip from our tests, as a character. Ideal sidekick to Candle: "did it beat me?"' }
      ]
    };
  }
}
</script>
</body>
</html>
