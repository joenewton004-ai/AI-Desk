<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Avatar concepts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#ff8a3d}a:hover{color:#ffb07a}
</style>
</helmet>
<div style="width: 1440px; height: 1240px; box-sizing: border-box; padding: 56px 64px; background: #1b2330; color: #f3f1ec; font-family: Lato, Carlito, 'DejaVu Sans', sans-serif; display: flex; flex-direction: column; gap: 36px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; color: #9fb0c6">Backtest Bench · avatar concepts</div>
      <h1 style="margin: 0; font-size: 44px; font-weight: 900">Pick a host</h1>
    </div>
    <p style="margin: 0; max-width: 520px; font-size: 17px; line-height: 1.5; color: #c6d0dd">Each host swaps between five stills as the script changes tone. Same five moods for every concept, so the build script can pick one per line.</p>
  </div>

  <sc-for list="{{concepts}}" as="c" hint-placeholder-count="3">
    <div style="display: flex; gap: 28px; align-items: stretch; background: #222c3b; border-radius: 16px; padding: 24px">
      <div style="width: 250px; flex: none; display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #ff8a3d">{{c.tag}}</div>
        <div style="font-size: 28px; font-weight: 900">{{c.name}}</div>
        <div style="font-size: 15px; line-height: 1.5; color: #c6d0dd">{{c.pitch}}</div>
        <div style="font-size: 14px; line-height: 1.5; color: #9fb0c6">{{c.tradeoff}}</div>
      </div>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{c.faces}}" as="f" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 8px; align-items: center">
            <div style="width: 100%; aspect-ratio: 1; background: #1b2330; border-radius: 12px; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{c.isHuman}}" hint-placeholder-val="{{ true }}">
                <svg viewBox="0 0 200 200" width="170" height="170" role="img" aria-label="{{f.label}}">
                  <path d="M40 200 Q40 150 100 148 Q160 150 160 200 Z" fill="#8fb3d9"></path>
                  <path d="M84 148 L100 172 L116 148 Z" fill="#f3f1ec"></path>
                  <circle cx="100" cy="92" r="52" fill="#f2c9a5"></circle>
                  <path d="M48 86 Q50 34 100 36 Q150 34 152 86 Q140 58 100 58 Q62 58 48 86 Z" fill="#4a3426"></path>
                  <path d="M44 84 Q44 30 100 30 Q156 30 156 84" fill="none" stroke="#2b3444" stroke-width="8"></path>
                  <rect x="36" y="78" width="16" height="30" rx="6" fill="#ff8a3d"></rect>
                  <rect x="148" y="78" width="16" height="30" rx="6" fill="#ff8a3d"></rect>
                  <path d="{{f.brow}}" stroke="#4a3426" stroke-width="6" stroke-linecap="round" fill="none"></path>
                  <ellipse cx="80" cy="90" rx="6" ry="{{f.eye}}" fill="#1b2330"></ellipse>
                  <ellipse cx="120" cy="90" rx="6" ry="{{f.eye}}" fill="#1b2330"></ellipse>
                  <path d="{{f.mouth}}" stroke="#7a3b2e" stroke-width="5" stroke-linecap="round" fill="{{f.mouthFill}}"></path>
                </svg>
              </sc-if>
              <sc-if value="{{c.isCandle}}" hint-placeholder-val="{{ false }}">
                <svg viewBox="0 0 200 200" width="170" height="170" role="img" aria-label="{{f.label}}">
                  <line x1="100" y1="14" x2="100" y2="52" stroke="#ff8a3d" stroke-width="8" stroke-linecap="round"></line>
                  <line x1="100" y1="168" x2="100" y2="192" stroke="#ff8a3d" stroke-width="8" stroke-linecap="round"></line>
                  <rect x="56" y="50" width="88" height="120" rx="14" fill="#ff8a3d"></rect>
                  <rect x="56" y="50" width="88" height="20" rx="10" fill="#ffb07a"></rect>
                  <path d="{{f.brow}}" stroke="#1b2330" stroke-width="6" stroke-linecap="round" fill="none"></path>
                  <ellipse cx="80" cy="90" rx="7" ry="{{f.eye}}" fill="#1b2330"></ellipse>
                  <ellipse cx="120" cy="90" rx="7" ry="{{f.eye}}" fill="#1b2330"></ellipse>
                  <path d="{{f.mouth}}" stroke="#1b2330" stroke-width="5" stroke-linecap="round" fill="{{f.mouthFillDark}}"></path>
                  <rect x="18" y="100" width="34" height="10" rx="5" fill="#ff8a3d"></rect>
                  <rect x="148" y="100" width="34" height="10" rx="5" fill="#ff8a3d"></rect>
                </svg>
              </sc-if>
              <sc-if value="{{c.isPixel}}" hint-placeholder-val="{{ false }}">
                <svg viewBox="0 0 200 200" width="170" height="170" role="img" aria-label="{{f.label}}" shape-rendering="crispEdges">
                  <rect x="40" y="160" width="120" height="40" fill="#8fb3d9"></rect>
                  <rect x="52" y="40" width="96" height="110" fill="#f2c9a5"></rect>
                  <rect x="52" y="32" width="96" height="22" fill="#4a3426"></rect>
                  <rect x="44" y="40" width="10" height="40" fill="#4a3426"></rect>
                  <rect x="146" y="40" width="10" height="40" fill="#4a3426"></rect>
                  <rect x="60" y="78" width="80" height="26" fill="none" stroke="#1b2330" stroke-width="6"></rect>
                  <line x1="100" y1="78" x2="100" y2="104" stroke="#1b2330" stroke-width="6"></line>
                  <path d="{{f.brow}}" stroke="#4a3426" stroke-width="7" stroke-linecap="square" fill="none"></path>
                  <ellipse cx="80" cy="91" rx="6" ry="{{f.eye}}" fill="#1b2330"></ellipse>
                  <ellipse cx="120" cy="91" rx="6" ry="{{f.eye}}" fill="#1b2330"></ellipse>
                  <path d="{{f.mouthPixel}}" stroke="#7a3b2e" stroke-width="6" stroke-linecap="square" fill="none"></path>
                  <rect x="86" y="150" width="28" height="12" fill="#f2c9a5"></rect>
                </svg>
              </sc-if>
            </div>
            <div style="font-size: 15px; font-weight: 700">{{f.label}}</div>
            <div style="font-size: 13px; color: #9fb0c6; text-align: center; line-height: 1.4">{{f.when}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const faces = [
      { label: 'Neutral', when: 'Explaining the rules', brow: 'M66 72 L90 70 M110 70 L134 72', eye: 6,
        mouth: 'M84 118 Q100 126 116 118', mouthPixel: 'M84 124 L116 124', mouthFill: 'none', mouthFillDark: 'none' },
      { label: 'Shocked', when: 'A big number lands', brow: 'M66 62 L90 56 M110 56 L134 62', eye: 9,
        mouth: 'M90 122 a10 12 0 1 0 20 0 a10 12 0 1 0 -20 0', mouthPixel: 'M92 116 L108 116 L108 132 L92 132 Z', mouthFill: '#7a3b2e', mouthFillDark: '#1b2330' },
      { label: 'Sceptical', when: 'Testing a guru claim', brow: 'M66 74 L90 72 M110 62 L134 68', eye: 4,
        mouth: 'M86 124 L114 118', mouthPixel: 'M86 126 L100 126 L100 122 L114 122', mouthFill: 'none', mouthFillDark: 'none' },
      { label: 'Pleased', when: 'Something actually worked', brow: 'M66 66 L90 64 M110 64 L134 66', eye: 3,
        mouth: 'M80 114 Q100 138 120 114', mouthPixel: 'M82 118 L82 126 L118 126 L118 118', mouthFill: 'none', mouthFillDark: 'none' },
      { label: 'Thinking', when: 'Caveats and limits', brow: 'M66 70 L90 72 M110 66 L134 66', eye: 6,
        mouth: 'M90 122 Q104 118 114 122', mouthPixel: 'M92 124 L112 124', mouthFill: 'none', mouthFillDark: 'none' }
    ];
    return {
      concepts: [
        { tag: 'Concept A', name: 'The Host', isHuman: true, isCandle: false, isPixel: false, faces,
          pitch: 'A flat cartoon of a presenter in orange headphones. Reads as "a real person made this", which suits a voice clone of you.',
          tradeoff: 'Most personal. Needs to look like you (hair, glasses) or it feels odd.' },
        { tag: 'Concept B', name: 'Candle', isHuman: false, isCandle: true, isPixel: false, faces,
          pitch: 'The orange candle from the logo, given a face and little arms. A mascot that IS the brand.',
          tradeoff: 'Most memorable and merch-able. Less "a person tested this".' },
        { tag: 'Concept C', name: 'Pixel Tester', isHuman: false, isCandle: false, isPixel: true, faces,
          pitch: 'A blocky 8-bit tester in goggles. Retro-game feel, very readable at Shorts size.',
          tradeoff: 'Strong on phones and fun. Most "gimmicky" for a finance channel.' }
      ]
    };
  }
}
</script>
</body>
</html>
