<html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{background:#fff;font-family:'Lato','Carlito','DejaVu Sans',sans-serif}
.box{background:#1b2330;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#avatar{width:800px;height:800px}
#banner{width:2560px;height:1440px;gap:70px}
#banner .bg,#avatar .bg{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 2px,transparent 2px),linear-gradient(90deg,#ffffff08 2px,transparent 2px);background-size:80px 80px}
.word{position:relative;color:#f3f1ec}
.word h1{font-size:150px;font-weight:900;letter-spacing:-2px;line-height:1}
.word h1 span{color:#ff8a3d}
.word p{font-size:52px;color:#9fb0c6;margin-top:22px}
svg{position:relative}
</style></head><body>
<template id="mark">
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- three candles on a bench: up, down, up -->
  <line x1="58" y1="38" x2="58" y2="118" stroke="#8fb3d9" stroke-width="6" stroke-linecap="round"/>
  <rect x="44" y="58" width="28" height="44" rx="4" fill="#8fb3d9"/>
  <line x1="100" y1="22" x2="100" y2="118" stroke="#ff8a3d" stroke-width="6" stroke-linecap="round"/>
  <rect x="86" y="36" width="28" height="62" rx="4" fill="#ff8a3d"/>
  <line x1="142" y1="48" x2="142" y2="118" stroke="#8fb3d9" stroke-width="6" stroke-linecap="round"/>
  <rect x="128" y="66" width="28" height="36" rx="4" fill="#8fb3d9"/>
  <!-- the bench -->
  <rect x="22" y="120" width="156" height="16" rx="5" fill="#f3f1ec"/>
  <rect x="40" y="136" width="12" height="40" rx="3" fill="#f3f1ec"/>
  <rect x="148" y="136" width="12" height="40" rx="3" fill="#f3f1ec"/>
  <rect x="40" y="158" width="120" height="8" rx="3" fill="#f3f1ec" opacity=".55"/>
</svg></template>
<div id="avatar" class="box"><div class="bg"></div><div class="m" style="width:560px;height:560px"></div></div>
<div id="banner" class="box"><div class="bg"></div><div class="m" style="width:330px;height:330px"></div>
<div class="word"><h1>Backtest <span>Bench</span></h1><p>Famous trading strategies, tested honestly</p></div></div>
<script>document.querySelectorAll('.m').forEach(m=>{m.innerHTML=document.getElementById('mark').innerHTML;m.firstElementChild.setAttribute('width','100%');m.firstElementChild.setAttribute('height','100%');m.style.position='relative'})</script>
</body></html>
