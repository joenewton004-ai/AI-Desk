<html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{font-family:'Lato','Carlito','DejaVu Sans',sans-serif}
.mark{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--g)}
.mark i{display:block;background:#2e7b8b;border-radius:calc(var(--g)*.6)}
.mark i.d{background:#cfe4e8}
.mark i.t{background:#f2b440;position:relative}
.mark i.t::after{content:"";position:absolute;left:28%;top:16%;width:26%;height:50%;border:solid #1f4e5c;border-width:0 var(--tk) var(--tk) 0;transform:rotate(45deg)}
#icon{width:1000px;height:1000px;background:#1f4e5c;display:flex;align-items:center;justify-content:center}
#icon .mark{--g:34px;--tk:30px;width:600px;height:600px}
#banner{width:3360px;height:840px;background:#1f4e5c;display:flex;align-items:center;justify-content:center;gap:110px;position:relative;overflow:hidden}
#banner .mark{--g:22px;--tk:20px;width:380px;height:380px;flex:none}
#banner .bg{position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 2px,transparent 2px),linear-gradient(90deg,#ffffff0d 2px,transparent 2px);background-size:120px 120px}
.w{position:relative;color:#fff}
.w h1{font-size:190px;font-weight:900;letter-spacing:-2px;line-height:1}
.w h1 span{color:#f2b440}
.w p{font-size:66px;color:#cfe4e8;margin-top:28px}
</style></head><body>
<div id="icon"><div class="mark"><i></i><i class="d"></i><i></i><i class="d"></i><i class="t"></i><i></i><i></i><i></i><i class="d"></i></div></div>
<div id="banner"><div class="bg"></div><div class="mark" style="position:relative"><i></i><i class="d"></i><i></i><i class="d"></i><i class="t"></i><i></i><i></i><i></i><i class="d"></i></div>
<div class="w"><h1>BoxByBox<span>Sheets</span></h1><p>UK tax &amp; bookkeeping spreadsheets · Excel &amp; Google Sheets</p></div></div>
</body></html>
