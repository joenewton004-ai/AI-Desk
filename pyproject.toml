[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-desk"
version = "0.1.0"
description = "A small, honest, rules-based trading desk: data -> signal -> risk -> execution."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
plot = ["matplotlib>=3.7"]

[project.scripts]
ai-desk = "ai_desk.cli:main"

[tool.setuptools.packages.find]
include = ["ai_desk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
